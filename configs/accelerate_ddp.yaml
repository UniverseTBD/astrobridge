# ddp training for stage1/stage2 only
# edit `num_processes` to your GPU count

# for example, launch with:
#   accelerate launch --config_file configs/accelerate_ddp.yaml scripts/03_train_stage1.py
compute_environment: LOCAL_MACHINE
distributed_type: MULTI_GPU
debug: false
downcast_bf16: "no"
gpu_ids: all
machine_rank: 0
main_training_function: main
mixed_precision: bf16

# 1 for single node/machine
num_machines: 1

# gpu count per node/machine
num_processes: 4
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
use_cpu: false

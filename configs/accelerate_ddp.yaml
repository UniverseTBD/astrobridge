# Starting point for single-node multi-GPU DDP training (stage1/stage2 only — 00-02/04 are
# single-process). Generated by `accelerate config`; edit `num_processes` to your GPU count and
# re-run `accelerate config` if you'd rather answer the prompts interactively instead.
#
# Launch with:
#   accelerate launch --config_file configs/accelerate_ddp.yaml scripts/03_train_stage1.py
#
# See captioner/README.md's cluster section for why DDP (full frozen-LLM replica per GPU)
# rather than FSDP is the supported path here, and what to do if a single GPU can't fit that.
compute_environment: LOCAL_MACHINE
distributed_type: MULTI_GPU
debug: false
downcast_bf16: "no"
gpu_ids: all
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1          # baseline for a single node. Multi-node IS supported: the sbatch
                         # overrides num_machines/num_processes/machine_rank/main_process_ip on
                         # the accelerate CLI (see slurm/_accel_node.sh), so this file stays a
                         # valid standalone single-node config and is not rewritten per run.
num_processes: 4         # <-- set this to your GPU count
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
use_cpu: false

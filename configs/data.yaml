# Data sources, join, split, and caption-decomposition config.
# No object/join counts are hardcoded here (see 05_build_spec_image_spectra.md §1) —
# only warning thresholds, which are config, not spec constants.

sources:
  spectra:
    hf_path: UniverseTBD/AstroBridge-Data
    revision: null   # not loaded via `datasets.load_dataset` — see data/spectra_dataset.py.
                      # No `split` here: the repo's multiple parquet files are read directly.
    files:
      - observations/spectra/desi_sdss_subset_crossmatch_nolan_1.0arcsec.parquet
  image:
    # PIXEL/FLUX source only now — `legacy_south_all_images.parquet` (real calibrated per-band
    # flux for AION). Captions moved to their own repo below.
    hf_path: gapatron/legacy_survey_south_images_captions
    revision: null   # not a `datasets.load_dataset`-shaped repo — see data/image_dataset.py.
  image_captions:
    # `caption_fused` — Gemini's merged blind+properties+literature caption, one row per object
    # in parquet shards. Was gapatron/legacy_survey_south_images_captions' per-object
    # *_captions.json (`caption_blind`); this repo is the same author's superset. Keyed by
    # object_id in the Legacy Survey namespace (matched via object_id_legacy, same as before).
    hf_path: gapatron/astrobridge-image-captions
    # Pinned deliberately. This dataset's caption text gets rewritten in place, so `revision:
    # null` would silently change what a run trained on. History so far, every one a full
    # rewrite of all 3,487 objects with the same ids:
    #   d9fadc12  2026-09-10 21:34  what v5 and v6 trained on
    #   233e44f2  2026-09-11 22:04  add captioning prompt source (caption-blind-v2)
    #   0e1cc339  2026-09-11 23:07  update captioning prompt (caption-blind-v3-merger)
    #   b8967f45  2026-09-12 01:16  <- v7 trains on this
    # Verified against the live repo before re-pinning: caption_fused and caption_blind differ on
    # 3487/3487 objects vs d9fadc12, while the pixel columns (flux_*/ivar_*/mask_*) are
    # byte-identical — so the image EMBEDDING cache stays valid across this bump and only
    # `make captions` needs re-running, not `make cache`.
    revision: b8967f451d0516f89892c3229b1cbef733977391
                      # read directly from data/train-*.parquet, not via `datasets.load_dataset`
                      # — see data/image_dataset.py. No `split` here: the repo has only `train`.
    # Which caption stage feeds the image tier. caption_fused is the dataset's own final output:
    # an editor pass that takes the three earlier drafts (blind, properties, literature) as
    # proposals rather than ground truth and re-examines the pixels itself, resolving
    # disagreements by looking at the image instead of trusting whichever draft sounded most
    # confident. Same no-name/no-designation rule is enforced and re-checked on every stage, so
    # it is no more leak-prone than caption_blind. Alternatives: caption_blind (image-only,
    # open-ended), caption_properties (structured resolvedness/color/structure),
    # caption_literature (image + capped literature excerpts).
    caption_field: caption_fused
    # null/omitted = both surveys. Set to [legacy-south] to reproduce the pre-swap object set
    # exactly: one cutout size (160x160) and ivar/mask present throughout. legacy-north is
    # 152x152 with no ivar/mask/i-band — real gaps in that release, handled but worth knowing.
    surveys: null
  spectra_captions:
    # Teammate-produced, spectrum-grounded LLM captions (Gemini) — the spectra-tier equivalent
    # of gapatron's caption_blind for images. Spectra-tier captions are restricted to just the
    # objects this file covers (see scripts/01_generate_captions.py) rather than falling back to
    # mention_summary decomposition for the rest — a deliberate scope choice, not a limitation
    # of the loader. v2: now hosted directly in AstroBridge-Data rather than a separate personal
    # repo — confirmed live: 2,021 usable captions (up from 1,223 in v1), object_key format
    # (gmw_XXXXXXXX) still matches the spectra table's wiki_entity_id column.
    hf_path: UniverseTBD/AstroBridge-Data
    # v6 switches to the ground-truth caption set. Verified live against the repo: 2,024
    # objects, every caption regenerated with gemini-3.8-flash — the text differs on
    # 2024/2024 objects shared with the previous file, so this is a full rewrite rather
    # than a patch. 23 objects in the old file are absent here and none are new.
    # Previous (v5 and earlier): captions/spectra/desi_sdss_combined_v2_gemini-3_7-flash.jsonl
    filename: captions/spectra/captions_combined_ground_truth_v1_gemini-3_8-flash.jsonl
    revision: null
  transients:
    # 987 ZTF BTS supernovae with accepted alert photometry — the only source of time-domain data.
    # Its `object_id` is a ZTF designation, a namespace shared with nothing else here, so these
    # objects are APPENDED to the manifest as new rows rather than joined (see data/manifest.py).
    # The host-image columns (`image_flux`, `display_image`, `host_image_caption`) are debugging
    # artifacts and are deliberately never read — transients contribute the lightcurve tier only.
    hf_path: BuildNg/astrobridge-transients-dataset
    revision: null   # not loaded via `datasets.load_dataset` — see data/transients_dataset.py

join:
  key: _healpix_29
  fallback_radius_arcsec: 1.0   # coordinate crossmatch radius when `key` isn't in both tables

splits:
  # train is implicit (everything not assigned to val/test). val/test are drawn according to
  # `policy` below, and unpaired objects always go to train — see manifest.py.
  # v7: OFF. The source's own split labels put 331 of the 334 DESI spectra in test, leaving
  # exactly 2 DESI spectra in train — so v5/v6 trained almost entirely on SDSS and were scored
  # on a spectra test set that is 72% DESI, across a boundary AION itself treats as two separate
  # modalities (tok_spectrum_desi vs tok_spectrum_sdss). There is no way to get DESI into
  # training while honouring that labelling, so it is dropped in favour of the survey-stratified
  # draw below. `split_upstream` is still carried in the manifest for reference and reporting.
  # NOTE: this makes v7's test set NOT comparable object-for-object with v4/v5/v6.
  honor_upstream: false
  # Strata for the val/test draw. `tier` alone is not enough when a tier mixes populations the
  # model must generalise across — see _draw_per_tier in data/manifest.py. `survey` splits
  # desi/sdss within the spectra tier and legacy-south/legacy-north within the image tier
  # (different cutout sizes, and north has no ivar/mask/i-band). Light curves have no survey and
  # form their own stratum rather than being dropped from the draw.
  stratify_by: [tier, survey]
  policy: stratified
  # stratified | joint_only | auto.
  #   auto       - the original behaviour: joint-only when there are at least
  #                sanity.min_joint_objects of them, otherwise stratified across all tiers.
  #   stratified - always draw val/test from all tiers, stratified by tier.
  #   joint_only - always draw from joint-tier objects only.
  # Pinned to `stratified` deliberately rather than left on `auto`: `auto` silently changes the
  # meaning of val/test as soon as the joint count crosses min_joint_objects, which would make
  # val_loss incomparable across runs for a reason nothing in the logs points at.
  # v7: 70/20/10 train/val/test (was 80/10/10). Fractions are the val and test shares; train is
  # whatever is left. Drawn within every (tier, survey) stratum, so each survey lands 70/20/10 on
  # its own rather than only the totals working out.
  val: 0.2
  test: 0.1
  # Per-tier overrides on the val/test fractions above — stratification itself (which strata
  # form, e.g. survey within spectra) is unaffected, only the split sizes within each stratum.
  # spectra: no separate external held-out test set exists anywhere in this repo (unlike
  # image/lightcurve, which eval against their own dedicated test datasets — Galaxy10's own test
  # parquet, the YSE test set) — so carving out `test` here would hold data back from training
  # with nothing that will ever score it. 80/20 train/val instead, no test, survey-stratified
  # (SDSS/DESI) exactly as the un-overridden draw would be. Revisit if a real spectra eval set is
  # ever built — at that point this override should come back out.
  tier_overrides:
    spectra:
      val: 0.2
      test: 0.0
  seed: ${seed}          # resolved from base.yaml at load time

sanity:
  min_joint_objects: 500      # log a loud warning below this; do not fail
  min_per_subset: 50          # warn if any dropout-weighted subset is thinner than this

manifest:
  out_dir: outputs/manifest
  parquet: outputs/manifest/manifest.parquet
  stats: outputs/manifest/manifest_stats.json

cache:
  out_dir: outputs/cache

captions:
  out_dir: outputs/captions
  parquet: outputs/captions/captions.parquet
  report: outputs/captions/decomposition_report.json
  # Image-tier captions come directly from gapatron's pre-vetted `caption_blind` field (see
  # data/image_dataset.py), not from keyword-based decomposition — so `rule_based_v0` below only
  # governs decomposition of AstroBridge-Data's `mention_summary` (spectra + relational claims).
  generator: rule_based_v0     # swap for an LLM-backed extractor; see src/captioner/data/captions.py

# Data sources, join, split, and caption-decomposition config

sources:
  spectra:
    hf_path: UniverseTBD/AstroBridge-Data
    revision: null
    files:
      - observations/spectra/desi_sdss_subset_crossmatch_nolan_1.0arcsec.parquet
  image:
    hf_path: gapatron/legacy_survey_south_images_captions
    revision: null
  image_captions:

    # `caption_fused` -> caption column generated by merging blind+properties+literature captions
    hf_path: gapatron/astrobridge-image-captions
    revision: b8967f451d0516f89892c3229b1cbef733977391
    caption_field: caption_fused
    surveys: null
  spectra_captions:
    local_path: null

    # spectra LLM captions via Gemini
    hf_path: UniverseTBD/AstroBridge-Data
    filename: captions/spectra/captions_combined_ground_truth_v1_gemini-3_8-flash.jsonl
    revision: null
  transients:

    # ZTF BTS supernovae with accepted alert photometry
    hf_path: BuildNg/astrobridge-transients-dataset
    revision: null

join:
  key: _healpix_29
  fallback_radius_arcsec: 1.0

splits:
  honor_upstream: false
  stratify_by: [tier, survey]

  #   auto       - the original behaviour: joint-only when there are at least
  #                sanity.min_joint_objects of them, otherwise stratified across all tiers.
  #   stratified - always draw val/test from all tiers, stratified by tier.
  #   joint_only - always draw from joint-tier objects only.
  policy: stratified

  val: 0.2
  test: 0.1

  # 80/20 train/val (SDSS/DESI)
  tier_overrides:
    spectra:
      val: 0.2
      test: 0.0
  seed: ${seed}

sanity:
  min_joint_objects: 500
  min_per_subset: 50

manifest:
  out_dir: outputs/manifest
  parquet: outputs/manifest/manifest.parquet
  stats: outputs/manifest/manifest_stats.json

cache:
  out_dir: outputs/cache

captions:
  out_dir: outputs/captions
  parquet: outputs/captions/captions.parquet
  report: outputs/captions/decomposition_report.json
  generator: rule_based_v0
